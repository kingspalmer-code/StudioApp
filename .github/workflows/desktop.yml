# Builds Oatcake for Mac (desktop/) into a .dmg that runs on both Apple silicon and Intel Macs.
# Pull requests just check it builds; on main the .dmg is also published to the "desktop"
# release, so the download link always points at the newest build.
name: Mac app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust for both kinds of Mac
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Build
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$RUNNER_TEMP/Oatcake.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Oatcake-mac
          path: ${{ runner.temp }}/Oatcake.dmg

      - name: Publish the download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "Oatcake for Mac" \
            --notes "Download Oatcake.dmg below, open it, and drag Oatcake into Applications. The first time you open it, macOS may say it can't check the app: go to System Settings > Privacy & Security and click Open Anyway."
          gh release upload desktop "$RUNNER_TEMP/Oatcake.dmg" --clobber
