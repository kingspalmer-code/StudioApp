[package]
name = "oatcake"
version = "1.1.0"
description = "Oatcake for Mac"
edition = "2021"

[lib]
name = "oatcake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-window-state = "=2.4.1"
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
